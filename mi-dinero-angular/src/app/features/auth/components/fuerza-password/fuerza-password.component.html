@let e = evaluacion();
<div class="fuerza" aria-live="polite">
  <div class="fuerza-barra" role="progressbar" aria-label="Seguridad de la contraseña"
    aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="e.puntuacion">
    <div class="fuerza-relleno" [class]="claseRelleno()" [style.width.%]="e.puntuacion"></div>
  </div>
  <p class="fuerza-etiqueta" [class]="claseTexto()">Seguridad: {{ e.etiqueta }}</p>
  @if (e.recomendaciones.length > 0) {
    <ul class="recomendaciones">
      @for (recomendacion of e.recomendaciones; track recomendacion) {
        <li>{{ recomendacion }}</li>
      }
    </ul>
  }
</div>
