<span class="campo-password">
  <input #entrada [type]="visible() ? 'text' : 'password'" [value]="valor()"
    [placeholder]="placeholder()" [attr.autocomplete]="autocomplete()"
    (input)="valor.set(entrada.value)" (blur)="tocado.emit()" />
  <button type="button" class="btn-ojo" [attr.aria-pressed]="visible()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    (click)="alternarVisibilidad()">{{ visible() ? '🙈' : '👁️' }}</button>
</span>
